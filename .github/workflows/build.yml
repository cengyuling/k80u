- name: Download Kernel Source
  run: |
    # 使用 klimt 的官方源码地址
    git clone --depth=1 -b bsp-klimt-v-oss https://github.com/MiCode/MTK_kernel_device_modules kernel_common

- name: Build Module
  run: |
    cd kernel_common
    make ARCH=arm64 LLVM=1 gki_defconfig
    # 完整编译内核，以生成准确的 Module.symvers
    make ARCH=arm64 LLVM=1 -j$(nproc) 
    cd ..
    make ARCH=arm64 LLVM=1 -C kernel_common M=$GITHUB_WORKSPACE modules
