name: Build Kernel Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang llvm lld clang-tools binutils make bc flex bison libssl-dev libelf-dev cpio libarchive-tools

      - name: Download Kernel Source (Klimt / MT6991)
        run: |
          git clone --depth=1 -b 17.0 https://github.com/iowaz/android_kernel_xiaomi_klimt kernel_common

      - name: Build Module
        run: |
          cd kernel_common
          
          # 1. 初始化配置
          make ARCH=arm64 LLVM=1 gki_defconfig
          
          # 2. 关闭容易导致 Action 环境崩溃的选项（禁用 kheaders 和 模块签名）
          scripts/config --file .config --disable CONFIG_IKHEADERS
          scripts/config --file .config --disable CONFIG_MODULE_SIG
          
          # 3. 更新配置
          make ARCH=arm64 LLVM=1 olddefconfig
          
          # 4. 完整编译内核，生成 Module.symvers
          # 使用 V=1 输出详细日志，限制 -j4 防止内存溢出
          make ARCH=arm64 LLVM=1 V=1 -j4
          
          cd ..
          # 5. 编译我们的模块
          make ARCH=arm64 LLVM=1 -C kernel_common M=$GITHUB_WORKSPACE modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-ko
          path: overclock.ko
