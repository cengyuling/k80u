name: Build Kernel Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Module with GKI Action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: 'https://android.googlesource.com/kernel/common'
          branch: 'android15-6.6'
          config: 'gki_defconfig'
          arch: 'arm64'
          android-version: 15
          extra-cmd: 'make LLVM=1 M=$GITHUB_WORKSPACE modules'
