name: Build Kernel Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang llvm lld clang-tools make bc flex bison libssl-dev libelf-dev cpio

      - name: Download Kernel Source (AOSP 6.6)
        run: |
          git clone --depth=1 -b android15-6.6 https://android.googlesource.com/kernel/common kernel_common

      - name: Build Module
        run: |
          cd kernel_common
          make ARCH=arm64 LLVM=1 gki_defconfig
          
          # 完整编译内核，生成 Module.symvers 符号表（这是解决 undefined 报错的关键）
          make ARCH=arm64 LLVM=1 -j$(nproc)
          
          cd ..
          # 带着符号表编译我们的模块
          make ARCH=arm64 LLVM=1 -C kernel_common M=$GITHUB_WORKSPACE modules

      - name: Patch Vermagic (伪装内核版本号)
        run: |
          python3 -c "
          import sys
          
          # 你的手机真实内核版本号
          target_ver = b'6.6.118-android15-8-gb9cc6ec16bc8-abogki536571621-4k'
          
          with open('overclock.ko', 'rb+') as f:
              data = f.read()
              idx = data.find(b'vermagic=')
              if idx != -1:
                  start = idx + 9
                  end = data.find(b'\x00', start)
                  old_ver = data[start:end]
                  print(f'Original vermagic: {old_ver.decode()}')
                  
                  # 检查长度并替换
                  if len(target_ver) <= len(old_ver):
                      new_ver = target_ver + b'\x00' * (len(old_ver) - len(target_ver))
                      f.seek(start)
                      f.write(new_ver)
                      print(f'Successfully patched vermagic to: {target_ver.decode()}')
                  else:
                      print('Error: Target vermagic is longer than original!')
                      sys.exit(1)
              else:
                  print('Error: vermagic not found in module!')
                  sys.exit(1)
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-ko
          path: overclock.ko
