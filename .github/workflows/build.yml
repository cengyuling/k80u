name: Build Kernel Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 加入 binutils，提供 GNU 版本的 ar 命令
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev cpio libarchive-tools clang lld llvm binutils

      - name: Setup Swap Space (防内存溢出)
        run: |
          # 停用并删除 GitHub 默认的 swap
          sudo swapoff -a
          sudo rm -f /swapfile

          # 使用 dd 创建 4GB 的新 swap
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 确认内存和 Swap 状态
          free -h

      - name: Download Kernel Source (Klimt / MT6991)
        run: |
          git clone --depth=1 -b 17.0 https://github.com/iowaz/android_kernel_xiaomi_klimt kernel_common

      - name: Build Module
        run: |
          cd kernel_common
          
          # 生成基础配置
          make ARCH=arm64 LLVM=1 gki_defconfig
          
          # 1. 清理证书配置（这是导致 built-in.a 报错的常见“暗雷”）
          scripts/config --file .config --disable CONFIG_SYSTEM_TRUSTED_KEYS
          scripts/config --file .config --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""
          
          # 2. 关闭不需要的复杂特性
          scripts/config --file .config --disable CONFIG_IKHEADERS
          scripts/config --file .config --disable CONFIG_MODULE_SIG
          scripts/config --file .config --disable CONFIG_LTO_CLANG_THIN
          scripts/config --file .config --disable CONFIG_LTO_CLANG
          
          # 更新配置
          make ARCH=arm64 LLVM=1 olddefconfig
          
          # 3. 强制使用 GNU 原生 ar 工具，绕开 llvm-ar 的兼容性 Bug
          # 4. 使用 -j2 双线程编译，防止并发过高
          make ARCH=arm64 LLVM=1 AR=ar -j2
          
          cd ..
          # 编译我们的外部模块
          make ARCH=arm64 LLVM=1 AR=ar -C kernel_common M=$GITHUB_WORKSPACE modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-ko
          path: overclock.ko
