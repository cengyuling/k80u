name: Build Kernel Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev cpio libarchive-tools clang lld llvm

      - name: Setup Swap Space (防内存溢出)
        run: |
          # 1. 停用并删除 GitHub Actions 默认占用的 swap 文件，解决 Text file busy 报错
          sudo swapoff -a
          sudo rm -f /swapfile

          # 2. 使用 dd 创建 4GB 的新 swap 文件
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 3. 确认内存状态，你应该能看到 4.0Gi 的 Swap
          free -h

      - name: Download Kernel Source (Klimt / MT6991)
        run: |
          git clone --depth=1 -b 17.0 https://github.com/iowaz/android_kernel_xiaomi_klimt kernel_common

      - name: Build Module
        run: |
          cd kernel_common
          
          # 生成基础配置
          make ARCH=arm64 LLVM=1 gki_defconfig
          
          # 关闭导致崩溃和不需要的选项
          scripts/config --file .config --disable CONFIG_IKHEADERS
          scripts/config --file .config --disable CONFIG_MODULE_SIG
          scripts/config --file .config --disable CONFIG_LTO_CLANG_THIN
          scripts/config --file .config --disable CONFIG_LTO_CLANG
          
          # 更新配置
          make ARCH=arm64 LLVM=1 olddefconfig
          
          # 使用 -j2 (双线程) 进行编译，配合上面的 4G Swap，防止内存溢出
          make ARCH=arm64 LLVM=1 -j2
          
          cd ..
          # 编译我们的外部模块
          make ARCH=arm64 LLVM=1 -C kernel_common M=$GITHUB_WORKSPACE modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-ko
          path: overclock.ko
