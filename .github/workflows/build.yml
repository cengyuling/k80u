name: Build Kernel Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang lld make bc flex bison libssl-dev libelf-dev

      - name: Download Kernel Source (Android 15 / 6.6)
        run: |
          # 拉取安卓通用的 6.6 内核头文件，用于编译模块
          git clone --depth=1 -b android15-6.6 https://android.googlesource.com/kernel/common kernel_common
          
      - name: Build Module
        run: |
          # 将你的代码和Makefile复制到内核目录
          cp Makefile overclock.c kernel_common/
          cd kernel_common
          # 自动修改Makefile里的路径指向当前内核
          sed -i 's|KDIR := /lib/modules/$(shell uname -r)/build|KDIR := $(PWD)|' Makefile
          # 生成配置并编译
          make ARCH=arm64 LLVM=1 defconfig
          make ARCH=arm64 LLVM=1 M=$PWD modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-ko
          path: kernel_common/overclock.ko
