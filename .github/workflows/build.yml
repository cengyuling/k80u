name: Build Kernel Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 核心修复：补充了 llvm 和 clang-tools 完整工具链
          sudo apt-get install -y git build-essential clang llvm lld clang-tools make bc flex bison libssl-dev libelf-dev

      - name: Download Kernel Source
        run: |
          git clone --depth=1 -b android15-6.6 https://android.googlesource.com/kernel/common kernel_common

      - name: Build Module
        run: |
          cd kernel_common
          # 显式指定 LLVM=1 确保使用 LLVM 工具链
          make ARCH=arm64 LLVM=1 gki_defconfig
          make ARCH=arm64 LLVM=1 modules_prepare
          cd ..
          make ARCH=arm64 LLVM=1 -C kernel_common M=$GITHUB_WORKSPACE modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-ko
          path: overclock.ko
