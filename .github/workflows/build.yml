name: Build Kernel Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang llvm lld clang-tools make bc flex bison libssl-dev libelf-dev cpio

      - name: Download Kernel Source (Klimt / MT6991)
        run: |
          git clone --depth=1 -b 17.0 https://github.com/iowaz/android_kernel_xiaomi_klimt kernel_common

      - name: Build Module
        run: |
          cd kernel_common
          make ARCH=arm64 LLVM=1 gki_defconfig
          
          # 关闭一切可能导致报错的非必要安全/调试配置
          scripts/config --file .config --disable CONFIG_IKHEADERS
          scripts/config --file .config --disable CONFIG_MODULE_SIG
          scripts/config --file .config --disable CONFIG_MODULE_SIG_ALL
          scripts/config --file .config --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --file .config --disable CONFIG_UBSAN
          scripts/config --file .config --disable CONFIG_UBSAN_SIGNED_WRAP
          scripts/config --file .config --disable CONFIG_UBSAN_INTEGER_WRAP
          
          # 更新配置
          make ARCH=arm64 LLVM=1 olddefconfig
          
          # 完整编译内核以生成 Module.symvers
          make ARCH=arm64 LLVM=1 -j$(nproc)
          
          cd ..
          # 编译我们的外部模块
          make ARCH=arm64 LLVM=1 -C kernel_common M=$GITHUB_WORKSPACE modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-ko
          path: overclock.ko
